<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#111214" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>BatchFrame Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg-base:       #0a0c10;
    --bg-surface:    #11141b;
    --bg-elevated:   #1a1d26;
    --bg-highlight:  #242936;
    --border:        #2d3343;
    --border-subtle: #1e222d;
    --accent:        #5c7cff;
    --green:         #34d27e;
    --red:           #ff5c6a;
    --text-primary:   #f0f3f9;
    --text-secondary: #a0a8c0;
    --text-muted:     #636c8a;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Menlo', 'Consolas', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-base); color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent; overflow: hidden;
    letter-spacing: 0.01em;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  header {
    padding: 10px 12px; background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 8px;
    padding-top: max(10px, env(safe-area-inset-top));
    /* double-tap here toggles fullscreen — don't flash a text selection */
    user-select: none; -webkit-user-select: none;
  }
  header .title {
    font-size: 12px; font-weight: 500; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .title .sym { font-weight: 700; flex: 0 0 auto; }
  .title .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .back-btn {
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 5px 8px; border-radius: 4px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1;
    cursor: pointer; flex: 0 0 auto;
  }
  .back-btn:active { background: var(--bg-highlight); color: var(--text-primary); }
  header .status { font-size: 10px; color: var(--text-muted); }
  header .sync, header .up, header .fs {
    font-family: var(--font-mono);
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 5px 9px;
    border-radius: 4px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  header .sync:active, header .up:active, header .fs:active { background: var(--bg-highlight); }
  header .sync.on {
    background: rgba(52, 210, 126, 0.12); border-color: rgba(52, 210, 126, 0.4);
    color: var(--green);
  }
  header .fs.on {
    background: rgba(92, 124, 255, 0.12); border-color: rgba(92, 124, 255, 0.4);
    color: var(--accent);
  }

  .subs {
    display: flex; overflow-x: auto; gap: 6px; padding: 8px 12px;
    background: var(--bg-base); border-bottom: 1px solid var(--border-subtle);
    scrollbar-width: none;
  }
  .subs::-webkit-scrollbar { display: none; }
  .subs .chip {
    font-family: var(--font-mono);
    background: var(--bg-elevated); padding: 6px 10px; border-radius: 4px;
    font-size: 11px; white-space: nowrap;
    border: 1px solid var(--border); color: var(--text-secondary);
    cursor: pointer;
  }
  .subs .chip::before { content: '> '; color: var(--text-muted); }
  .subs .chip:active { background: var(--bg-highlight); color: var(--text-primary); }

  .burger {
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 9px; border-radius: 4px; cursor: pointer;
    font-family: var(--font-mono); font-size: 14px; line-height: 1;
  }
  .burger:active { background: var(--bg-highlight); }
  .menu {
    position: absolute; top: calc(env(safe-area-inset-top) + 42px); right: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px; min-width: 180px; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 2px;
  }
  .menu button {
    background: none; border: none; color: var(--text-secondary);
    font-family: var(--font-mono); font-size: 12px;
    padding: 8px 10px; border-radius: 4px; text-align: left; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .menu button:active { background: var(--bg-highlight); color: var(--text-primary); }
  .menu button .badge {
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
    background: var(--bg-highlight); color: var(--text-muted);
  }
  .menu button.on .badge { background: var(--green); color: #000; }
  .menu-backdrop {
    position: fixed; inset: 0; z-index: 40;
  }

  .folder-cell {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base);
  }
  .folder-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .folder-cell .fallback {
    color: var(--text-muted); font-size: 32px;
  }
  .folder-cell .label {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 6px;
    background: linear-gradient(180deg, rgba(10,12,16,0), rgba(10,12,16,0.88));
    color: var(--text-primary);
    font-family: var(--font-mono); font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .folder-cell .label::before { content: '> '; color: var(--green); }

  main {
    flex: 1; overflow-y: auto; padding: 6px;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: var(--bg-base);
  }
  :root { --cols: 3; }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: 2px;
  }
  .cell, .folder-cell {
    background: var(--bg-base);
    border: none;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .cell img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: var(--bg-base);
  }
  .cell.active {
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  .cell.selected::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 2px rgba(10,12,16,0.85);
    pointer-events: none;
  }
  .cell.selected {
    box-shadow: inset 0 0 0 2px rgba(52, 210, 126, 0.35);
  }

  .empty {
    color: var(--text-muted); text-align: center;
    padding: 40px 20px; font-size: 12px;
    font-family: var(--font-mono);
  }
  .empty::before { content: '// '; color: var(--text-muted); }

  /* preview overlay */
  .overlay {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; flex-direction: column;
    font-family: var(--font-mono);
  }
  .overlay.chrome-hidden { cursor: none; }
  .overlay-top {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: var(--text-primary); font-size: 11px;
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    transition: opacity 0.25s, transform 0.25s;
  }
  .overlay.chrome-hidden .overlay-top {
    opacity: 0; transform: translateY(-6px); pointer-events: none;
  }
  .overlay-top .close, .overlay-top .ovfs {
    background: none; border: none; color: var(--text-primary);
    font-size: 16px; padding: 4px 8px; cursor: pointer;
    font-family: var(--font-mono);
  }
  .overlay-top .idx {
    flex: 1; font-size: 11px; text-align: center;
    color: var(--text-secondary); letter-spacing: 0.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .overlay-img-wrap {
    flex: 1; position: relative; display: flex;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  .overlay-img-wrap img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
    transform-origin: center center; will-change: transform;
  }
  /* while zoomed the wrap owns the gesture: the browser must not pan/scroll it */
  .overlay-img-wrap.zoomed { touch-action: none; }
  .overlay-img-wrap.zoomed .zone { cursor: grab; }
  .overlay-img-wrap.panning .zone { cursor: grabbing; }
  .overlay-img-wrap.animating img { transition: transform 0.18s ease-out; }
  .zone { position: absolute; top: 0; bottom: 0; width: 33%; z-index: 2; }
  .zone.left   { left: 0; }
  .zone.right  { right: 0; }
  .zone.center { left: 33%; right: 33%; }

  .overlay-top .zoomlvl {
    background: rgba(255,255,255,0.12); color: var(--text-primary);
    border: none; border-radius: 3px; padding: 3px 7px; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.02em;
  }
  .overlay-top .zoomlvl[hidden] { display: none; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elevated); color: var(--text-primary);
    padding: 8px 14px; border-radius: 4px;
    border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px;
    z-index: 200; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  .disconnected {
    background: rgba(255, 92, 106, 0.15); color: var(--red);
    text-align: center; padding: 4px; font-size: 10px;
    border-bottom: 1px solid rgba(255, 92, 106, 0.3);
    font-family: var(--font-mono);
  }
  .disconnected::before { content: '[!] '; }

  /* scroll preview overlay */
  .scroll-overlay {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; flex-direction: column;
    font-family: var(--font-mono);
  }
  .scroll-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: var(--text-primary);
    transition: opacity 0.25s, transform 0.25s;
  }
  .scroll-overlay.chrome-hidden .scroll-top { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  .scroll-top .close, .scroll-top .ovfs {
    background: none; border: none; color: var(--text-primary);
    font-size: 16px; padding: 4px 8px; cursor: pointer; font-family: var(--font-mono);
  }
  .scroll-top .idx {
    flex: 1; text-align: center; font-size: 11px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scroll-container {
    flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    overscroll-behavior: contain;
  }
  .scroll-container::-webkit-scrollbar { display: none; }
  .scroll-item {
    width: 100%;
    background: #000;
    display: block;
  }
  .scroll-item img {
    width: 100%; height: auto; display: block;
    user-select: none; -webkit-user-drag: none;
  }

  /* Peek: transient magnifier for scroll mode. It lives in its own layer and
     is position:fixed to the frame's measured rect, so the feed's layout and
     scrollTop never change — currentScrollIdx() stays put and no goto-preview
     fires at the desktop while you're inspecting a frame. */
  .peek { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .peek[hidden] { display: none; }
  .peek-backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.72);
    opacity: 0; transition: opacity 0.16s;
  }
  .peek img {
    position: fixed; transform-origin: center center; will-change: transform;
    user-select: none; -webkit-user-drag: none;
  }
  .peek-lvl {
    position: absolute; left: 50%; margin-left: -22px;
    top: max(12px, env(safe-area-inset-top));
    background: rgba(0,0,0,0.6); border: 1px solid var(--border);
    color: var(--text-primary); font-family: var(--font-mono); font-size: 11px;
    padding: 4px 9px; border-radius: 4px; text-align: center;
    opacity: 0; transition: opacity 0.12s;
  }
  .peek.on .peek-backdrop { opacity: 1; }
  /* the readout only flashes on a zoom change, then gets out of the way */
  .peek.lvl-on .peek-lvl { opacity: 1; }
  .peek.releasing img, .peek.animating img { transition: transform 0.18s ease-out; }
</style>
</head>
<body>
<div id="app">
  <div id="conn" class="disconnected" style="display:none">Reconnecting…</div>
  <header title="Double-click for fullscreen">
    <button class="back-btn" id="btnBack" title="Up folder" style="display:none">←</button>
    <div class="title" id="title"><span class="sym" id="titleSym"></span><span class="name" id="titleName">—</span></div>
    <button class="burger" id="btnMenu" title="Menu">☰</button>
  </header>
  <div id="menuBackdrop" class="menu-backdrop" style="display:none"></div>
  <div id="menu" class="menu" style="display:none">
    <button id="miSync" class="on"><span>Sync desktop</span><span class="badge" id="miSyncBadge">ON</span></button>
    <button id="miFs"><span>Fullscreen</span><span class="badge" id="miFsBadge">OFF</span></button>
    <button id="miScroll"><span>Scroll preview</span><span class="badge" id="miScrollBadge">OFF</span></button>
    <button id="miReset"><span>Reset thumbnail size</span><span class="badge" id="miColsBadge">3</span></button>
  </div>
  <div class="subs" id="subs"></div>
  <main id="main">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No items</div>
  </main>
</div>

<div class="overlay" id="overlay" style="display:none">
  <div class="overlay-top">
    <button class="close" id="btnClose">✕</button>
    <div class="idx" id="ovIdx"></div>
    <button class="zoomlvl" id="ovZoom" title="Reset zoom" hidden>1.0×</button>
    <button class="ovfs" id="btnOvFs" title="Fullscreen">⛶</button>
  </div>
  <div class="overlay-img-wrap" id="ovWrap">
    <img id="ovImg" alt="" draggable="false" />
    <div class="zone left" id="zoneLeft"></div>
    <div class="zone center" id="zoneCenter"></div>
    <div class="zone right" id="zoneRight"></div>
  </div>
</div>

<div class="scroll-overlay" id="scrollOv" style="display:none">
  <div class="scroll-top" id="scrollTop">
    <button class="close" id="btnScrollClose">✕</button>
    <div class="idx" id="scrollIdx"></div>
    <button class="ovfs" id="btnScrollFs" title="Fullscreen">⛶</button>
  </div>
  <div class="scroll-container" id="scrollContainer"></div>
  <div class="peek" id="peek" hidden>
    <div class="peek-backdrop"></div>
    <img id="peekImg" alt="" draggable="false" />
    <div class="peek-lvl" id="peekLvl">1.0×</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  if (!token) { document.body.innerHTML = '<p style="padding:20px;color:#f66">Missing token.</p>'; return; }

  const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?t=${encodeURIComponent(token)}`;
  const thumbUrl  = (id) => `/thumb/${id}?t=${encodeURIComponent(token)}`;
  const folderThumbUrl = (id) => `/folder-thumb/${id}?t=${encodeURIComponent(token)}`;
  const fullUrl   = (id) => `/full/${id}?t=${encodeURIComponent(token)}`;

  let ws = null;
  let state = null;
  let sync = true;
  let scrollMode = localStorage.getItem('bf_scroll') === '1';
  let localPreviewIdx = null;   // when sync=off, this device drives its own preview
  let localPreviewOpen = false;
  let scrollOpen = false;
  let scrollSuppressSync = false;  // guard: don't loop when we programmatically scroll

  const $ = (id) => document.getElementById(id);

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1200);
  }

  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { $('conn').style.display = 'none'; };
    ws.onclose = () => { $('conn').style.display = 'block'; setTimeout(connect, 1500); };
    ws.onerror = () => { try { ws.close(); } catch {} };
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') { state = msg.state; render(); }
      } catch {}
    };
  }
  connect();

  function send(intent, payload) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'intent', intent, payload: payload || {} }));
  }

  function currentPreviewIdx() {
    if (!state) return null;
    if (sync) return state.previewOpen ? state.previewIndex : null;
    return localPreviewOpen ? localPreviewIdx : null;
  }

  const SYMBOLS = ['!', '#', '$', '%', '&', '@', '*', '+', '=', '?', '/', '~', '^', '|'];
  const COLORS  = ['#34d27e', '#5c7cff', '#ff5c6a', '#f5a623', '#a78bfa', '#22d3ee', '#f472b6', '#facc15'];
  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function pickSymbol(name) {
    const h = hashStr(name || 'root');
    return { sym: SYMBOLS[h % SYMBOLS.length], color: COLORS[(h >> 3) % COLORS.length] };
  }

  function render() {
    if (!state) return;
    const name = state.folderName || state.folderPath || 'No folder';
    const s = pickSymbol(name);
    const symEl = $('titleSym');
    symEl.textContent = s.sym;
    symEl.style.color = s.color;
    $('titleName').textContent = name;
    $('btnBack').style.display = state.parentFolderPath ? 'inline-flex' : 'none';
    $('subs').style.display = 'none';

    const grid = $('grid');
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();

    const folders = state.subfolders || [];
    const imgs = state.images || [];

    const buildFolderCell = (sf) => {
      const cell = document.createElement('div');
      cell.className = 'folder-cell';
      cell.dataset.aspect = '1';
      const im = document.createElement('img');
      im.loading = 'lazy'; im.decoding = 'async';
      im.src = folderThumbUrl(sf.id);
      im.onerror = () => { im.remove(); const fb = document.createElement('div'); fb.className = 'fallback'; fb.textContent = '▦'; cell.appendChild(fb); };
      cell.appendChild(im);
      const label = document.createElement('div');
      label.className = 'label'; label.textContent = sf.name;
      cell.appendChild(label);
      cell.onclick = () => { if (sync) send('nav-folder', { path: sf.path }); else toast('Sync off — nav ignored'); };
      return cell;
    };

    const activeIdx = currentPreviewIdx();
    const selectedSet = new Set(state.selectedIds || []);
    const buildImageCell = (img, i) => {
      const cell = document.createElement('div');
      let cls = 'cell';
      if (i === activeIdx) cls += ' active';
      if (selectedSet.has(img.id)) cls += ' selected';
      cell.className = cls;
      const aspect = (img.w && img.h) ? img.w / img.h : 1;
      cell.dataset.aspect = String(aspect);
      const im = document.createElement('img');
      im.loading = 'lazy'; im.decoding = 'async';
      im.src = thumbUrl(img.id);
      cell.appendChild(im);
      cell.onclick = () => {
        if (scrollMode) {
          if (sync) send('open-preview', { index: i });
          openScrollPreview(i);
          return;
        }
        if (sync) send('open-preview', { index: i });
        else { localPreviewIdx = i; localPreviewOpen = true; renderOverlay(); }
      };
      return cell;
    };

    $('empty').style.display = (folders.length + imgs.length) === 0 ? 'block' : 'none';
    folders.forEach((sf) => frag.appendChild(buildFolderCell(sf)));
    imgs.forEach((img, i) => frag.appendChild(buildImageCell(img, i)));
    grid.appendChild(frag);

    renderOverlay();
    syncScrollOverlay();
  }

  function syncScrollOverlay() {
    if (!state) return;
    const items = state.images || [];
    const desktopIdx = state.previewOpen ? state.previewIndex : null;
    // Sync desktop-driven open when scroll mode is on
    if (scrollMode && sync && desktopIdx !== null && !scrollOpen) {
      openScrollPreview(desktopIdx);
      return;
    }
    if (!scrollOpen) return;
    if (sync && desktopIdx === null) {
      $('scrollOv').style.display = 'none'; scrollOpen = false;
      return;
    }
    if (sync && desktopIdx !== null) {
      // Skip programmatic scroll while user is actively scrolling — otherwise
      // desktop echoes fight the user's inertia and yank the view back.
      if (Date.now() - lastUserScroll < 900) return;
      const c = $('scrollContainer');
      const currentIdx = currentScrollIdx();
      if (desktopIdx !== currentIdx) {
        scrollSuppressSync = true;
        const target = c.children[desktopIdx];
        if (target) {
          // Position target as "second from top": leave a strip of the previous
          // image visible above so laptop-driven nav has context, not jarring.
          const prev = c.children[desktopIdx - 1];
          const peekPrev = prev ? Math.min(prev.offsetHeight, c.clientHeight * 0.2) : 0;
          const top = Math.max(0, target.offsetTop - peekPrev);
          c.scrollTo({ top, behavior: 'smooth' });
        }
        setTimeout(() => { scrollSuppressSync = false; }, 500);
        if (items[desktopIdx]) $('scrollIdx').textContent = `[${desktopIdx + 1}/${items.length}] ${items[desktopIdx].name}`;
      }
    }
  }

  // hamburger menu

    pkBase = { left: r.left, top: r.top, width: r.width, height: r.height };
    const p = $('peek'), pi = $('peekImg');
    pi.src = srcImg.currentSrc || srcImg.src;   // already cached — no flash
    pi.style.left = r.left + 'px';
    pi.style.top = r.top + 'px';
    pi.style.width = r.width + 'px';
    pi.style.height = r.height + 'px';
    pkScale = 1; pkTx = 0; pkTy = 0;
    pkFit = false;                              // a fresh pinch peek, not a fitted one
    p.hidden = false;
    p.classList.remove('releasing');
    peekOn = true;
    peekApply();
    requestAnimationFrame(() => { if (peekOn) p.classList.add('on'); });
    return true;
  }

  function peekRelease() {
    if (!peekOn) return;
    const p = $('peek');
    peekOn = false; peekHeld = false; pkOneFinger = false; pkFit = false; pkGesture = null;
    pkScale = 1; pkTx = 0; pkTy = 0;
    pkLvlScale = null;                            // next peek re-flashes the readout
    if (pkLvlTimer) { clearTimeout(pkLvlTimer); pkLvlTimer = null; }
    p.classList.add('releasing');
    p.classList.remove('on', 'lvl-on');
    $('peekImg').style.transform = 'translate(0px, 0px) scale(1)';
    setTimeout(() => {
      if (peekOn) return;                       // a new peek began meanwhile
      p.hidden = true;
      p.classList.remove('releasing');
      pkBase = null;
    }, 190);
  }

  // Scale at which the frame stops leaving gaps and fills the window. Feed
  // frames are width-fitted, so for a tall one this is already 1 (it fills
  // the width and overflows) and the fill step gets skipped.
  // The scale that makes the frame's height exactly the window's height, so it
  // sits flush top and bottom with only sideways left to explore. This is
  // allowed to be below 1: a photo taller than the window has to shrink to fit,
  // and capping it at 1 was what left the vertical wide open.
  function peekFitScale() {
    if (!pkBase || !pkBase.height) return 1;
    return window.innerHeight / pkBase.height;
  }

  // Park the frame dead centre of the window at the given scale. A feed frame
  // can sit anywhere — half off the bottom, say — and magnifying it in place
  // would leave it just as awkwardly parked, so the cycle always recentres.
  function peekZoomCentred(next) {
    if (!pkBase) return;
    pkScale = Math.max(0.05, Math.min(PEEK_MAX, next));   // fitting may shrink below 1
    pkTx = window.innerWidth / 2 - (pkBase.left + pkBase.width / 2);
    pkTy = window.innerHeight / 2 - (pkBase.top + pkBase.height / 2);
    // stick, so a fit that shrinks below 1 isn't mistaken for a resting peek
    // and reset back to the frame's position in the feed
    peekApply(true);
  }

  // Double-tap toggles fill screen ↔ back to the feed, mirroring the standard
  // preview, and centres the frame. Pinch is left alone: it keeps its own
  // free-form anchoring around your fingers.
  function peekCycle(srcImg) {
    if (!peekOn) {
      if (!peekStart(srcImg)) return;
      peekHeld = true;
    }
    const p = $('peek');
    p.classList.add('animating');
    setTimeout(() => p.classList.remove('animating'), 200);
    // straight toggle: fit to the window, or drop back to the feed
    if (!pkFit) { peekZoomCentred(peekFitScale()); pkFit = true; }
    else peekRelease();
  }

  let pkD0 = null, pkS0 = 1, pkMx0 = 0, pkMy0 = 0, pkTx0 = 0, pkTy0 = 0;
  let pkOneFinger = false;   // pinch ended but a finger is still down: keep the peek

  $('scrollContainer').addEventListener('touchstart', (e) => {
    // a fresh gesture: drop any stale suppression, or it eats this tap's click
    pkSuppressClick = false;
    // A peek is up, so this finger belongs to the peek, not the feed. Without
    // this the first finger of a two-finger shift lands alone for a frame or
    // two, scrolls the feed, and dismisses the peek before the second finger
    // ever arrives — which made the shift gesture look broken on real devices.
    if (e.touches.length === 1 && peekOn) {
      const t = e.touches[0];
      pkMx0 = t.clientX; pkMy0 = t.clientY;
      pkTx0 = pkTx; pkTy0 = pkTy;
      pkOneFinger = true;
      return;
    }
    if (e.touches.length !== 2) return;
    const a = e.touches[0], b = e.touches[1];
    const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
    if (!peekOn && !peekStart(itemImgAt(mx, my))) return;
    pkD0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    pkS0 = pkScale; pkMx0 = mx; pkMy0 = my; pkTx0 = pkTx; pkTy0 = pkTy;
    pkOneFinger = false;                         // two fingers again
    pkGesture = null;                            // undecided until it moves
  }, { passive: true });

  $('scrollContainer').addEventListener('touchmove', (e) => {
    if (e.touches.length >= 2 && pkD0 !== null) {
      e.preventDefault();                        // stop the feed scrolling under us
      const a = e.touches[0], b = e.touches[1];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;

      // Only in the fitted state can two fingers mean two things, so that's the
      // only place worth deciding between them. Moving as a pair is a shift and
      // keeps the fit. Changing the spread is a zoom, and it becomes a held
      // inspection rather than a new resting state: clearing `peekHeld` means
      // the full lift springs it back to the feed, like a pinch from scratch.
      // Outside the fitted state two fingers are always a zoom, nothing to decide.
      if (pkFit && pkGesture === null) {
        const spread = Math.abs(d - pkD0);
        const slide = Math.hypot(mx - pkMx0, my - pkMy0);
        if (spread < PK_SLOP && slide < PK_SLOP) return;
        if (spread > slide) {
          pkGesture = 'zoom';
          pkFit = false;               // no longer parked; falls through to zooming
          peekHeld = false;            // and letting go returns to the feed
        } else {
          pkGesture = 'shift';
        }
      }

      if (pkFit) {
        // fitted + sliding: the border clamp pins the vertical by itself, since
        // at the fit scale the height equals the window's and its allowed range
        // collapses to a single value — only sideways is left to explore.
        pkTx = pkTx0 + (mx - pkMx0);
        pkTy = pkTy0 + (my - pkMy0);
        peekApply(true);
        pkSuppressClick = true;
        return;
      }

      // pinch-zoom: rebuild from the gesture start, spread about the original
      // midpoint, then carry however far that midpoint has drifted
      pkScale = pkS0; pkTx = pkTx0; pkTy = pkTy0;
      peekZoomAt(pkS0 * (d / pkD0), pkMx0, pkMy0);
      pkTx += mx - pkMx0; pkTy += my - pkMy0;
      peekApply();
      pkSuppressClick = true;
      return;
    }
    // one finger still on the glass: the peek stays, and that finger pans it —
    // without this the feed would scroll away underneath a live peek
    if (pkOneFinger && peekOn && e.touches.length === 1) {
      e.preventDefault();
      const t = e.touches[0];
      pkTx = pkTx0 + (t.clientX - pkMx0);
      pkTy = pkTy0 + (t.clientY - pkMy0);
      peekApply(pkFit);              // borders only bind in the double-tapped state
      pkSuppressClick = true;
    }
  }, { passive: false });

  $('scrollContainer').addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pkD0 = null;       // the pinch proper is over
    if (e.touches.length === 0) {
      pkOneFinger = false;
      if (peekOn && !peekHeld) peekRelease();    // only a full lift springs back
      return;
    }
    // a finger is still down, so you still mean to be here: keep the peek up
    // and hand control of it to whichever finger remains
    if (peekOn && e.touches.length === 1) {
      const t = e.touches[0];
      pkMx0 = t.clientX; pkMy0 = t.clientY;
      pkTx0 = pkTx; pkTy0 = pkTy;
      pkOneFinger = true;
    }
  }, { passive: true });

  // Single tap toggles chrome as before; a second tap holds a peek open so you
  // can study a frame hands-free. Chrome toggling isn't latency-critical, so
  // holding it 260ms to tell the two apart costs nothing.
  let scrollTapTimer = null;
  $('scrollContainer').addEventListener('click', (e) => {
    if (pkSuppressClick) { pkSuppressClick = false; return; }
    if (e.target.tagName !== 'IMG') return;
    if (scrollTapTimer) {
      clearTimeout(scrollTapTimer); scrollTapTimer = null;
      peekCycle(e.target);
      return;
    }
    scrollTapTimer = setTimeout(() => { scrollTapTimer = null; toggleScrollChrome(); }, 260);
  });

  // Desktop: plain wheel keeps scrolling the feed; ctrl/⌘+wheel peeks — the
  // same modifier the grid already uses for thumbnail sizing.
  $('scrollContainer').addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) {
      if (peekOn) peekRelease();
      return;
    }
    e.preventDefault();
    if (!peekOn) {
      if (!peekStart(itemImgAt(e.clientX, e.clientY))) return;
      peekHeld = true;
    }
    let d = e.deltaY;
    if (e.deltaMode === 1) d *= 16;
    else if (e.deltaMode === 2) d *= 400;
    const next = pkScale * Math.exp(-d * 0.0025);
    if (next <= 1.01) { peekRelease(); return; }
    pkFit = false;                              // free zooming leaves the fitted state
    peekZoomAt(next, e.clientX, e.clientY);
  }, { passive: false });

  // drag to re-aim a held peek (desktop)
  let pkMousePan = false, pkMx = 0, pkMy = 0;
  $('scrollContainer').addEventListener('mousedown', (e) => {
    pkSuppressClick = false;
    if (!peekOn || !peekHeld || e.button !== 0) return;
    e.preventDefault();
    pkMousePan = true; pkMx = e.clientX; pkMy = e.clientY;
    pkTx0 = pkTx; pkTy0 = pkTy;
  });
  window.addEventListener('mousemove', (e) => {
    if (!pkMousePan) return;
    pkTx = pkTx0 + (e.clientX - pkMx);
    pkTy = pkTy0 + (e.clientY - pkMy);
    peekApply(pkFit);
    if (Math.abs(e.clientX - pkMx) > 4 || Math.abs(e.clientY - pkMy) > 4) pkSuppressClick = true;
  });
  window.addEventListener('mouseup', () => { pkMousePan = false; });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && peekOn) { e.preventDefault(); peekRelease(); }
  });

  // scrolling away dismisses a held peek — its anchor frame is moving
  $('scrollContainer').addEventListener('scroll', () => {
    if (peekOn && peekHeld) peekRelease();
  }, { passive: true });

  // Two taps on blank chrome → toggle fullscreen. dblclick alone isn't enough:
  // touch browsers don't fire it reliably, hence the paired tap timer.
  function isBlankTarget(el) {
    if (!el) return false;
    if (el.id === 'main' || el.id === 'grid' || el.id === 'app') return true;
    if (el.classList && el.classList.contains('empty')) return true;
    return false;
  }
  // .title is flex:1, so the dead space between the folder name and ☰ is #title
  // itself rather than <header> — match on the ancestor, not a fixed id.
  function isHeaderBlank(el) {
    if (!el || !el.closest) return false;
    if (el.closest('button')) return false;  // ← and ☰ keep their own actions
    return !!el.closest('header');
  }
  function bindDoubleTapFs(el, isBlank) {
    el.addEventListener('dblclick', (e) => { if (isBlank(e.target)) toggleFs(); });
    let lastTap = 0, multi = false;
    el.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) { multi = true; lastTap = 0; }
    }, { passive: true });
    el.addEventListener('touchend', (e) => {
      // ignore multi-finger gestures (pinch); only single-tap counts
      if (multi || e.touches.length > 0 || e.changedTouches.length > 1) {
        if (e.touches.length === 0) multi = false;
        lastTap = 0;
        return;
      }
      if (!isBlank(e.target)) { lastTap = 0; return; }
      const now = Date.now();
      if (now - lastTap < 320) { toggleFs(); lastTap = 0; e.preventDefault(); }
      else lastTap = now;
    });
  }
  bindDoubleTapFs($('main'), isBlankTarget);
  bindDoubleTapFs(document.querySelector('header'), isHeaderBlank);
})();
</script>
</body>
</html>
