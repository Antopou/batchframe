<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#111214" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>BatchFrame Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg-base:       #0a0c10;
    --bg-surface:    #11141b;
    --bg-elevated:   #1a1d26;
    --bg-highlight:  #242936;
    --border:        #2d3343;
    --border-subtle: #1e222d;
    --accent:        #5c7cff;
    --green:         #34d27e;
    --red:           #ff5c6a;
    --text-primary:   #f0f3f9;
    --text-secondary: #a0a8c0;
    --text-muted:     #636c8a;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Menlo', 'Consolas', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg-base); color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent; overflow: hidden;
    letter-spacing: 0.01em;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  header {
    padding: 10px 12px; background: var(--bg-surface);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 8px;
    padding-top: max(10px, env(safe-area-inset-top));
    /* double-tap here toggles fullscreen — don't flash a text selection */
    user-select: none; -webkit-user-select: none;
  }
  header .title {
    font-size: 12px; font-weight: 500; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--text-primary);
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .title .sym { font-weight: 700; flex: 0 0 auto; }
  .title .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .back-btn {
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 5px 8px; border-radius: 4px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1;
    cursor: pointer; flex: 0 0 auto;
  }
  .back-btn:active { background: var(--bg-highlight); color: var(--text-primary); }
  header .status { font-size: 10px; color: var(--text-muted); }
  header .sync, header .up, header .fs {
    font-family: var(--font-mono);
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 5px 9px;
    border-radius: 4px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  header .sync:active, header .up:active, header .fs:active { background: var(--bg-highlight); }
  header .sync.on {
    background: rgba(52, 210, 126, 0.12); border-color: rgba(52, 210, 126, 0.4);
    color: var(--green);
  }
  header .fs.on {
    background: rgba(92, 124, 255, 0.12); border-color: rgba(92, 124, 255, 0.4);
    color: var(--accent);
  }

  .subs {
    display: flex; overflow-x: auto; gap: 6px; padding: 8px 12px;
    background: var(--bg-base); border-bottom: 1px solid var(--border-subtle);
    scrollbar-width: none;
  }
  .subs::-webkit-scrollbar { display: none; }
  .subs .chip {
    font-family: var(--font-mono);
    background: var(--bg-elevated); padding: 6px 10px; border-radius: 4px;
    font-size: 11px; white-space: nowrap;
    border: 1px solid var(--border); color: var(--text-secondary);
    cursor: pointer;
  }
  .subs .chip::before { content: '> '; color: var(--text-muted); }
  .subs .chip:active { background: var(--bg-highlight); color: var(--text-primary); }

  .burger {
    background: var(--bg-elevated); border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 6px 9px; border-radius: 4px; cursor: pointer;
    font-family: var(--font-mono); font-size: 14px; line-height: 1;
  }
  .burger:active { background: var(--bg-highlight); }
  .menu {
    position: absolute; top: calc(env(safe-area-inset-top) + 42px); right: 10px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px; min-width: 180px; z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: flex; flex-direction: column; gap: 2px;
  }
  .menu button {
    background: none; border: none; color: var(--text-secondary);
    font-family: var(--font-mono); font-size: 12px;
    padding: 8px 10px; border-radius: 4px; text-align: left; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .menu button:active { background: var(--bg-highlight); color: var(--text-primary); }
  .menu button .badge {
    font-size: 10px; padding: 2px 6px; border-radius: 3px;
    background: var(--bg-highlight); color: var(--text-muted);
  }
  .menu button.on .badge { background: var(--green); color: #000; }
  .menu-backdrop {
    position: fixed; inset: 0; z-index: 40;
  }

  .folder-cell {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-base);
  }
  .folder-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .folder-cell .fallback {
    color: var(--text-muted); font-size: 32px;
  }
  .folder-cell .label {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 6px;
    background: linear-gradient(180deg, rgba(10,12,16,0), rgba(10,12,16,0.88));
    color: var(--text-primary);
    font-family: var(--font-mono); font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .folder-cell .label::before { content: '> '; color: var(--green); }

  main {
    flex: 1; overflow-y: auto; padding: 6px;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: var(--bg-base);
  }
  :root { --cols: 3; }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: 2px;
  }
  .cell, .folder-cell {
    background: var(--bg-base);
    border: none;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    aspect-ratio: 1 / 1;
  }
  .cell img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: var(--bg-base);
  }
  .cell.active {
    outline: 2px solid var(--accent); outline-offset: -2px;
  }
  .cell.selected::after {
    content: '';
    position: absolute;
    top: 6px; right: 6px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 2px rgba(10,12,16,0.85);
    pointer-events: none;
  }
  .cell.selected {
    box-shadow: inset 0 0 0 2px rgba(52, 210, 126, 0.35);
  }

  .empty {
    color: var(--text-muted); text-align: center;
    padding: 40px 20px; font-size: 12px;
    font-family: var(--font-mono);
  }
  .empty::before { content: '// '; color: var(--text-muted); }

  /* preview overlay */
  .overlay {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; flex-direction: column;
    font-family: var(--font-mono);
  }
  .overlay.chrome-hidden { cursor: none; }
  .overlay-top {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: var(--text-primary); font-size: 11px;
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    transition: opacity 0.25s, transform 0.25s;
  }
  .overlay.chrome-hidden .overlay-top {
    opacity: 0; transform: translateY(-6px); pointer-events: none;
  }
  .overlay-top .close, .overlay-top .ovfs {
    background: none; border: none; color: var(--text-primary);
    font-size: 16px; padding: 4px 8px; cursor: pointer;
    font-family: var(--font-mono);
  }
  .overlay-top .idx {
    flex: 1; font-size: 11px; text-align: center;
    color: var(--text-secondary); letter-spacing: 0.02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .overlay-img-wrap {
    flex: 1; position: relative; display: flex;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  .overlay-img-wrap img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
    transform-origin: center center; will-change: transform;
  }
  /* while zoomed the wrap owns the gesture: the browser must not pan/scroll it */
  .overlay-img-wrap.zoomed { touch-action: none; }
  .overlay-img-wrap.zoomed .zone { cursor: grab; }
  .overlay-img-wrap.panning .zone { cursor: grabbing; }
  .overlay-img-wrap.animating img { transition: transform 0.18s ease-out; }
  .zone { position: absolute; top: 0; bottom: 0; width: 33%; z-index: 2; }
  .zone.left   { left: 0; }
  .zone.right  { right: 0; }
  .zone.center { left: 33%; right: 33%; }

  .overlay-top .zoomlvl {
    background: rgba(255,255,255,0.12); color: var(--text-primary);
    border: none; border-radius: 3px; padding: 3px 7px; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.02em;
  }
  .overlay-top .zoomlvl[hidden] { display: none; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-elevated); color: var(--text-primary);
    padding: 8px 14px; border-radius: 4px;
    border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px;
    z-index: 200; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  .disconnected {
    background: rgba(255, 92, 106, 0.15); color: var(--red);
    text-align: center; padding: 4px; font-size: 10px;
    border-bottom: 1px solid rgba(255, 92, 106, 0.3);
    font-family: var(--font-mono);
  }
  .disconnected::before { content: '[!] '; }

  /* scroll preview overlay */
  .scroll-overlay {
    position: fixed; inset: 0; background: #000; z-index: 100;
    display: flex; flex-direction: column;
    font-family: var(--font-mono);
  }
  .scroll-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: var(--text-primary);
    transition: opacity 0.25s, transform 0.25s;
  }
  .scroll-overlay.chrome-hidden .scroll-top { opacity: 0; transform: translateY(-6px); pointer-events: none; }
  .scroll-top .close, .scroll-top .ovfs {
    background: none; border: none; color: var(--text-primary);
    font-size: 16px; padding: 4px 8px; cursor: pointer; font-family: var(--font-mono);
  }
  .scroll-top .idx {
    flex: 1; text-align: center; font-size: 11px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scroll-container {
    flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    overscroll-behavior: contain;
  }
  .scroll-container::-webkit-scrollbar { display: none; }
  .scroll-item {
    width: 100%;
    background: #000;
    display: block;
  }
  .scroll-item img {
    width: 100%; height: auto; display: block;
    user-select: none; -webkit-user-drag: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="conn" class="disconnected" style="display:none">Reconnecting…</div>
  <header title="Double-click for fullscreen">
    <button class="back-btn" id="btnBack" title="Up folder" style="display:none">←</button>
    <div class="title" id="title"><span class="sym" id="titleSym"></span><span class="name" id="titleName">—</span></div>
    <button class="burger" id="btnMenu" title="Menu">☰</button>
  </header>
  <div id="menuBackdrop" class="menu-backdrop" style="display:none"></div>
  <div id="menu" class="menu" style="display:none">
    <button id="miSync" class="on"><span>Sync desktop</span><span class="badge" id="miSyncBadge">ON</span></button>
    <button id="miFs"><span>Fullscreen</span><span class="badge" id="miFsBadge">OFF</span></button>
    <button id="miScroll"><span>Scroll preview</span><span class="badge" id="miScrollBadge">OFF</span></button>
    <button id="miReset"><span>Reset thumbnail size</span><span class="badge" id="miColsBadge">3</span></button>
  </div>
  <div class="subs" id="subs"></div>
  <main id="main">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No items</div>
  </main>
</div>

<div class="overlay" id="overlay" style="display:none">
  <div class="overlay-top">
    <button class="close" id="btnClose">✕</button>
    <div class="idx" id="ovIdx"></div>
    <button class="zoomlvl" id="ovZoom" title="Reset zoom" hidden>1.0×</button>
    <button class="ovfs" id="btnOvFs" title="Fullscreen">⛶</button>
  </div>
  <div class="overlay-img-wrap" id="ovWrap">
    <img id="ovImg" alt="" draggable="false" />
    <div class="zone left" id="zoneLeft"></div>
    <div class="zone center" id="zoneCenter"></div>
    <div class="zone right" id="zoneRight"></div>
  </div>
</div>

<div class="scroll-overlay" id="scrollOv" style="display:none">
  <div class="scroll-top" id="scrollTop">
    <button class="close" id="btnScrollClose">✕</button>
    <div class="idx" id="scrollIdx"></div>
    <button class="ovfs" id="btnScrollFs" title="Fullscreen">⛶</button>
  </div>
  <div class="scroll-container" id="scrollContainer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get('t');
  if (!token) { document.body.innerHTML = '<p style="padding:20px;color:#f66">Missing token.</p>'; return; }

  const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/?t=${encodeURIComponent(token)}`;
  const thumbUrl  = (id) => `/thumb/${id}?t=${encodeURIComponent(token)}`;
  const folderThumbUrl = (id) => `/folder-thumb/${id}?t=${encodeURIComponent(token)}`;
  const fullUrl   = (id) => `/full/${id}?t=${encodeURIComponent(token)}`;

  let ws = null;
  let state = null;
  let sync = true;
  let scrollMode = localStorage.getItem('bf_scroll') === '1';
  let localPreviewIdx = null;   // when sync=off, this device drives its own preview
  let localPreviewOpen = false;
  let scrollOpen = false;
  let scrollSuppressSync = false;  // guard: don't loop when we programmatically scroll

  const $ = (id) => document.getElementById(id);

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1200);
  }

  function connect() {
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { $('conn').style.display = 'none'; };
    ws.onclose = () => { $('conn').style.display = 'block'; setTimeout(connect, 1500); };
    ws.onerror = () => { try { ws.close(); } catch {} };
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') { state = msg.state; render(); }
      } catch {}
    };
  }
  connect();

  function send(intent, payload) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'intent', intent, payload: payload || {} }));
  }

  function currentPreviewIdx() {
    if (!state) return null;
    if (sync) return state.previewOpen ? state.previewIndex : null;
    return localPreviewOpen ? localPreviewIdx : null;
  }

  const SYMBOLS = ['!', '#', '$', '%', '&', '@', '*', '+', '=', '?', '/', '~', '^', '|'];
  const COLORS  = ['#34d27e', '#5c7cff', '#ff5c6a', '#f5a623', '#a78bfa', '#22d3ee', '#f472b6', '#facc15'];
  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return Math.abs(h);
  }
  function pickSymbol(name) {
    const h = hashStr(name || 'root');
    return { sym: SYMBOLS[h % SYMBOLS.length], color: COLORS[(h >> 3) % COLORS.length] };
  }

  function render() {
    if (!state) return;
    const name = state.folderName || state.folderPath || 'No folder';
    const s = pickSymbol(name);
    const symEl = $('titleSym');
    symEl.textContent = s.sym;
    symEl.style.color = s.color;
    $('titleName').textContent = name;
    $('btnBack').style.display = state.parentFolderPath ? 'inline-flex' : 'none';
    $('subs').style.display = 'none';

    const grid = $('grid');
    grid.innerHTML = '';
    const frag = document.createDocumentFragment();

    const folders = state.subfolders || [];
    const imgs = state.images || [];

    const buildFolderCell = (sf) => {
      const cell = document.createElement('div');
      cell.className = 'folder-cell';
      cell.dataset.aspect = '1';
      const im = document.createElement('img');
      im.loading = 'lazy'; im.decoding = 'async';
      im.src = folderThumbUrl(sf.id);
      im.onerror = () => { im.remove(); const fb = document.createElement('div'); fb.className = 'fallback'; fb.textContent = '▦'; cell.appendChild(fb); };
      cell.appendChild(im);
      const label = document.createElement('div');
      label.className = 'label'; label.textContent = sf.name;
      cell.appendChild(label);
      cell.onclick = () => { if (sync) send('nav-folder', { path: sf.path }); else toast('Sync off — nav ignored'); };
      return cell;
    };

    const activeIdx = currentPreviewIdx();
    const selectedSet = new Set(state.selectedIds || []);
    const buildImageCell = (img, i) => {
      const cell = document.createElement('div');
      let cls = 'cell';
      if (i === activeIdx) cls += ' active';
      if (selectedSet.has(img.id)) cls += ' selected';
      cell.className = cls;
      const aspect = (img.w && img.h) ? img.w / img.h : 1;
      cell.dataset.aspect = String(aspect);
      const im = document.createElement('img');
      im.loading = 'lazy'; im.decoding = 'async';
      im.src = thumbUrl(img.id);
      cell.appendChild(im);
      cell.onclick = () => {
        if (scrollMode) {
          if (sync) send('open-preview', { index: i });
          openScrollPreview(i);
          return;
        }
        if (sync) send('open-preview', { index: i });
        else { localPreviewIdx = i; localPreviewOpen = true; renderOverlay(); }
      };
      return cell;
    };

    $('empty').style.display = (folders.length + imgs.length) === 0 ? 'block' : 'none';
    folders.forEach((sf) => frag.appendChild(buildFolderCell(sf)));
    imgs.forEach((img, i) => frag.appendChild(buildImageCell(img, i)));
    grid.appendChild(frag);

    renderOverlay();
    syncScrollOverlay();
  }

  function syncScrollOverlay() {
    if (!state) return;
    const items = state.images || [];
    const desktopIdx = state.previewOpen ? state.previewIndex : null;
    // Sync desktop-driven open when scroll mode is on
    if (scrollMode && sync && desktopIdx !== null && !scrollOpen) {
      openScrollPreview(desktopIdx);
      return;
    }
    if (!scrollOpen) return;
    if (sync && desktopIdx === null) {
      $('scrollOv').style.display = 'none'; scrollOpen = false;
      return;
    }
    if (sync && desktopIdx !== null) {
      // Skip programmatic scroll while user is actively scrolling — otherwise
      // desktop echoes fight the user's inertia and yank the view back.
      if (Date.now() - lastUserScroll < 900) return;
      const c = $('scrollContainer');
      const currentIdx = currentScrollIdx();
      if (desktopIdx !== currentIdx) {
        scrollSuppressSync = true;
        const target = c.children[desktopIdx];
        if (target) {
          // Position target as "second from top": leave a strip of the previous
          // image visible above so laptop-driven nav has context, not jarring.
          const prev = c.children[desktopIdx - 1];
          const peekPrev = prev ? Math.min(prev.offsetHeight, c.clientHeight * 0.2) : 0;
          const top = Math.max(0, target.offsetTop - peekPrev);
          c.scrollTo({ top, behavior: 'smooth' });
        }
        setTimeout(() => { scrollSuppressSync = false; }, 500);
        if (items[desktopIdx]) $('scrollIdx').textContent = `[${desktopIdx + 1}/${items.length}] ${items[desktopIdx].name}`;
      }
    }
  }

  // hamburger menu
  function openMenu()  { $('menu').style.display = 'flex'; $('menuBackdrop').style.display = 'block'; }
  function closeMenu() { $('menu').style.display = 'none'; $('menuBackdrop').style.display = 'none'; }
  function refreshMenuBadges() {
    $('miSync').classList.toggle('on', sync);
    $('miSyncBadge').textContent = sync ? 'ON' : 'OFF';
    const fsOn = !!fsElement() || isStandalone();
    $('miFs').classList.toggle('on', fsOn);
    $('miFsBadge').textContent = fsOn ? 'ON' : 'OFF';
    $('miColsBadge').textContent = String(cols);
    $('miScroll').classList.toggle('on', scrollMode);
    $('miScrollBadge').textContent = scrollMode ? 'ON' : 'OFF';
  }
  $('btnMenu').onclick = () => { refreshMenuBadges(); openMenu(); };
  $('menuBackdrop').onclick = closeMenu;
  $('btnBack').onclick = () => { if (sync) send('nav-up'); else toast('Sync off'); };

  let chromeHideTimer = null;
  function showChrome(resetTimer) {
    const ov = $('overlay');
    ov.classList.remove('chrome-hidden');
    if (chromeHideTimer) { clearTimeout(chromeHideTimer); chromeHideTimer = null; }
    if (resetTimer !== false) scheduleHideChrome();
  }
  function hideChrome() {
    $('overlay').classList.add('chrome-hidden');
    if (chromeHideTimer) { clearTimeout(chromeHideTimer); chromeHideTimer = null; }
  }
  function scheduleHideChrome() {
    if (chromeHideTimer) clearTimeout(chromeHideTimer);
    chromeHideTimer = setTimeout(hideChrome, 2500);
  }
  function toggleChrome() {
    const ov = $('overlay');
    if (ov.classList.contains('chrome-hidden')) showChrome(true);
    else hideChrome();
  }

  function renderOverlay() {
    const idx = currentPreviewIdx();
    const ov = $('overlay');
    if (idx === null || !state) {
      ov.style.display = 'none';
      zoomImgId = null;
      if (chromeHideTimer) { clearTimeout(chromeHideTimer); chromeHideTimer = null; }
      return;
    }
    const img = state.images[idx];
    if (!img) { ov.style.display = 'none'; zoomImgId = null; return; }
    const justOpened = ov.style.display === 'none';
    ov.style.display = 'flex';
    $('ovImg').src = fullUrl(img.id);
    // this runs on every state push, so only drop the zoom when the photo itself
    // changes — otherwise a desktop-side selection would snap you back to fit
    if (zoomImgId !== img.id) { zoomImgId = img.id; resetZoom(false); }
    $('ovIdx').textContent = `[${idx + 1}/${state.images.length}] ${img.name}`;
    if (justOpened) showChrome(true);
    // nav within preview: leave chrome state alone
  }

  // fullscreen
  function fsElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
  }
  async function enterFs() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) {
      if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
        toast('iOS: Share → Add to Home Screen for fullscreen');
      } else {
        toast('Fullscreen not supported');
      }
      return;
    }
    try { await req.call(el); } catch (e) { toast('Fullscreen blocked'); }
  }
  async function exitFs() {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) { try { await ex.call(document); } catch {} }
  }
  function toggleFs() { fsElement() ? exitFs() : enterFs(); }
  function syncFsUi() { refreshMenuBadges(); }
  document.addEventListener('fullscreenchange', syncFsUi);
  document.addEventListener('webkitfullscreenchange', syncFsUi);

  $('btnOvFs').onclick = toggleFs;
  $('miFs').onclick = () => { toggleFs(); setTimeout(refreshMenuBadges, 200); };

  $('miSync').onclick = () => {
    sync = !sync;
    refreshMenuBadges();
    toast(sync ? 'Sync ON' : 'Sync OFF');
    if (sync) { localPreviewOpen = false; localPreviewIdx = null; }
    render();
    closeMenu();
  };
  $('miReset').onclick = () => {
    cols = 3; applyCols(); refreshMenuBadges();
    toast('Thumbnail size reset');
    closeMenu();
  };
  $('miScroll').onclick = () => {
    scrollMode = !scrollMode;
    localStorage.setItem('bf_scroll', scrollMode ? '1' : '0');
    refreshMenuBadges();
    toast('Scroll preview ' + (scrollMode ? 'ON' : 'OFF'));
    closeMenu();
  };

  $('btnClose').onclick = () => {
    if (sync) send('close-preview');
    else { localPreviewOpen = false; renderOverlay(); }
  };
  function isOnImage(clientX, clientY) {
    const img = $('ovImg');
    if (!img) return false;
    const r = img.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return false;
    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
  }
  function closePreview() {
    if (sync) send('close-preview');
    else { localPreviewOpen = false; renderOverlay(); }
  }
  function navPrev() {
    if (sync) send('prev-preview');
    else if (localPreviewIdx > 0) { localPreviewIdx--; renderOverlay(); }
  }
  function navNext() {
    if (sync) send('next-preview');
    else if (state && localPreviewIdx < state.images.length - 1) { localPreviewIdx++; renderOverlay(); }
  }

  // While zoomed the side zones stop navigating — a tap there reveals the
  // chrome (and its reset control) instead of yanking you to another photo.
  let centerTapTimer = null;
  $('zoneLeft').onclick = (e) => {
    if (consumeTap()) return;
    if (isZoomed()) { toggleChrome(); return; }
    if (!isOnImage(e.clientX, e.clientY)) closePreview(); else navPrev();
  };
  $('zoneRight').onclick = (e) => {
    if (consumeTap()) return;
    if (isZoomed()) { toggleChrome(); return; }
    if (!isOnImage(e.clientX, e.clientY)) closePreview(); else navNext();
  };
  $('zoneCenter').onclick = (e) => {
    if (consumeTap()) return;
    if (!isZoomed() && !isOnImage(e.clientX, e.clientY)) { closePreview(); return; }
    // a second tap here means zoom, so hold the chrome toggle just long enough
    // to tell the two apart — nav taps on the side zones stay instant
    if (centerTapTimer) {
      clearTimeout(centerTapTimer); centerTapTimer = null;
      glide();
      if (isZoomed()) resetZoom(false); else zoomAt(DBL_ZOOM, e.clientX, e.clientY);
      return;
    }
    centerTapTimer = setTimeout(() => { centerTapTimer = null; toggleChrome(); }, 260);
  };

  // swipe for preview
  let touchStartX = null, touchStartY = null;
  $('ovWrap').addEventListener('touchstart', (e) => {
    // multi-touch is a pinch, and while zoomed a drag is a pan — neither navigates
    if (e.touches.length !== 1 || isZoomed()) { touchStartX = touchStartY = null; return; }
    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
  }, { passive: true });
  $('ovWrap').addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
    touchStartX = touchStartY = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      if (dx < 0) navNext(); else navPrev();
    } else if (dy > 80 && Math.abs(dy) > Math.abs(dx) * 1.2) {
      closePreview();
    }
  }, { passive: true });

  // ── preview zoom ──────────────────────────────────────────────────
  // The transform lives on #ovImg and .overlay-img-wrap clips it. Pan offsets
  // are screen px measured from the wrap's centre, which is where flexbox parks
  // the image, so translate() composes cleanly with the centred layout.
  const MIN_ZOOM = 1, MAX_ZOOM = 8, DBL_ZOOM = 2.5;
  let zScale = 1, zTx = 0, zTy = 0;
  let zoomImgId = null;      // reset zoom on image change, not on every state push
  let suppressClick = false; // a pan/pinch just ended — swallow the tap it spawns

  function isZoomed() { return zScale > 1.01; }

  // A pan or pinch synthesises a click on the tap zone underneath it. Any zone
  // handler calls this first so a drag never also navigates or closes.
  function consumeTap() {
    if (!suppressClick) return false;
    suppressClick = false;
    return true;
  }

  function clampPan() {
    const img = $('ovImg'), wrap = $('ovWrap');
    // offsetWidth is the layout box (unaffected by transform) = the fitted image
    const maxX = Math.max(0, (img.offsetWidth * zScale - wrap.clientWidth) / 2);
    const maxY = Math.max(0, (img.offsetHeight * zScale - wrap.clientHeight) / 2);
    zTx = Math.max(-maxX, Math.min(maxX, zTx));
    zTy = Math.max(-maxY, Math.min(maxY, zTy));
  }

  function applyZoom() {
    clampPan();
    $('ovImg').style.transform = `translate(${zTx}px, ${zTy}px) scale(${zScale})`;
    $('ovWrap').classList.toggle('zoomed', isZoomed());
    const badge = $('ovZoom');
    badge.hidden = !isZoomed();
    badge.textContent = zScale.toFixed(1) + '×';
  }

  function glide() {
    const wrap = $('ovWrap');
    wrap.classList.add('animating');
    setTimeout(() => wrap.classList.remove('animating'), 200);
  }

  function resetZoom(animate) {
    if (animate) glide();
    zScale = 1; zTx = 0; zTy = 0;
    applyZoom();
  }

  // Scale about a focal point so the pixel under the fingers/cursor stays put.
  function zoomAt(nextScale, clientX, clientY) {
    const r = $('ovWrap').getBoundingClientRect();
    const fx = clientX - (r.left + r.width / 2);
    const fy = clientY - (r.top + r.height / 2);
    const s = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, nextScale));
    zTx = fx - ((fx - zTx) * s / zScale);
    zTy = fy - ((fy - zTy) * s / zScale);
    zScale = s;
    if (!isZoomed()) { zTx = 0; zTy = 0; }
    applyZoom();
  }

  $('ovWrap').addEventListener('wheel', (e) => {
    e.preventDefault();
    let d = e.deltaY;
    if (e.deltaMode === 1) d *= 16;        // lines → px
    else if (e.deltaMode === 2) d *= 400;  // pages → px
    zoomAt(zScale * Math.exp(-d * 0.0025), e.clientX, e.clientY);
  }, { passive: false });

  let pinchD0 = null, pinchS0 = 1;
  let gx0 = 0, gy0 = 0, gTx0 = 0, gTy0 = 0;
  let touchPan = false, mousePan = false;

  $('ovWrap').addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const a = e.touches[0], b = e.touches[1];
      pinchD0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      pinchS0 = zScale;
      gx0 = (a.clientX + b.clientX) / 2;
      gy0 = (a.clientY + b.clientY) / 2;
      gTx0 = zTx; gTy0 = zTy;
      touchPan = false;
      touchStartX = touchStartY = null;  // a pinch is never a nav swipe
    } else if (e.touches.length === 1 && isZoomed()) {
      gx0 = e.touches[0].clientX; gy0 = e.touches[0].clientY;
      gTx0 = zTx; gTy0 = zTy;
      touchPan = true;
    }
  }, { passive: true });

  $('ovWrap').addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchD0) {
      e.preventDefault();
      const a = e.touches[0], b = e.touches[1];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
      // rebuild from the gesture's start each frame: spread about the original
      // midpoint, then carry however far that midpoint has since drifted
      zScale = pinchS0; zTx = gTx0; zTy = gTy0;
      zoomAt(pinchS0 * (d / pinchD0), gx0, gy0);
      zTx += mx - gx0; zTy += my - gy0;
      applyZoom();
      suppressClick = true;
    } else if (touchPan && e.touches.length === 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - gx0, dy = e.touches[0].clientY - gy0;
      zTx = gTx0 + dx; zTy = gTy0 + dy;
      applyZoom();
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) suppressClick = true;
    }
  }, { passive: false });

  $('ovWrap').addEventListener('touchend', (e) => {
    if (e.touches.length < 2) pinchD0 = null;
    if (e.touches.length === 0) touchPan = false;
  }, { passive: true });

  $('ovWrap').addEventListener('mousedown', (e) => {
    if (!isZoomed() || e.button !== 0) return;
    e.preventDefault();
    gx0 = e.clientX; gy0 = e.clientY; gTx0 = zTx; gTy0 = zTy;
    mousePan = true;
    $('ovWrap').classList.add('panning');
  });
  window.addEventListener('mousemove', (e) => {
    if (!mousePan) return;
    const dx = e.clientX - gx0, dy = e.clientY - gy0;
    zTx = gTx0 + dx; zTy = gTy0 + dy;
    applyZoom();
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) suppressClick = true;
  });
  window.addEventListener('mouseup', () => {
    if (!mousePan) return;
    mousePan = false;
    $('ovWrap').classList.remove('panning');
  });

  $('ovZoom').onclick = (e) => { e.stopPropagation(); resetZoom(true); };

  // prevent iOS double-tap zoom / rubber-band inside grid
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // thumbnail zoom (pinch on touch, ctrl+wheel on desktop)
  const MIN_COLS = 1, MAX_COLS = 8;
  let cols = parseInt(localStorage.getItem('bf_cols') || '3', 10);
  if (!Number.isFinite(cols)) cols = 3;
  function applyCols() {
    cols = Math.max(MIN_COLS, Math.min(MAX_COLS, cols));
    document.documentElement.style.setProperty('--cols', cols);
    localStorage.setItem('bf_cols', String(cols));
  }
  applyCols();

  let pinchDist0 = null, pinchCols0 = null;
  $('main').addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist0 = Math.hypot(dx, dy);
      pinchCols0 = cols;
    }
  }, { passive: true });
  $('main').addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchDist0) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      const scale = dist / pinchDist0;
      // scale > 1 (spread) → fewer cols (bigger thumbs); < 1 (pinch) → more cols
      const step = Math.round(Math.log2(scale) * -2);
      const target = pinchCols0 + step;
      if (target !== cols) { cols = target; applyCols(); }
    }
  }, { passive: true });
  $('main').addEventListener('touchend', (e) => {
    if (e.touches.length < 2) { pinchDist0 = null; pinchCols0 = null; }
  });
  $('main').addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    cols += e.deltaY > 0 ? 1 : -1;
    applyCols();
  }, { passive: false });

  // scroll preview
  let scrollChromeTimer = null;
  function showScrollChrome(reset) {
    $('scrollOv').classList.remove('chrome-hidden');
    if (scrollChromeTimer) { clearTimeout(scrollChromeTimer); scrollChromeTimer = null; }
    if (reset !== false) scrollChromeTimer = setTimeout(hideScrollChrome, 2500);
  }
  function hideScrollChrome() { $('scrollOv').classList.add('chrome-hidden'); }
  function toggleScrollChrome() {
    const ov = $('scrollOv');
    if (ov.classList.contains('chrome-hidden')) showScrollChrome(true);
    else hideScrollChrome();
  }

  function openScrollPreview(startIdx) {
    const container = $('scrollContainer');
    container.innerHTML = '';
    const items = (state && state.images) || [];
    if (items.length === 0) return;
    items.forEach((img, i) => {
      const div = document.createElement('div');
      div.className = 'scroll-item';
      div.dataset.idx = String(i);
      const im = document.createElement('img');
      im.decoding = 'async';
      im.loading = (Math.abs(i - startIdx) <= 2) ? 'eager' : 'lazy';
      // reserve height with real aspect so lazy items don't collapse to 0
      if (img.w && img.h) im.style.aspectRatio = `${img.w} / ${img.h}`;
      im.src = fullUrl(img.id);
      div.appendChild(im);
      container.appendChild(div);
    });
    $('scrollOv').style.display = 'flex';
    scrollOpen = true;
    $('scrollIdx').textContent = `[${startIdx + 1}/${items.length}] ${items[startIdx].name}`;
    requestAnimationFrame(() => {
      scrollSuppressSync = true;
      const target = container.children[startIdx];
      if (target) target.scrollIntoView({ block: 'start' });
      setTimeout(() => { scrollSuppressSync = false; }, 300);
      showScrollChrome(true);
    });
  }

  function closeScrollPreview() {
    $('scrollOv').style.display = 'none';
    scrollOpen = false;
    if (scrollChromeTimer) { clearTimeout(scrollChromeTimer); scrollChromeTimer = null; }
    if (sync) send('close-preview');
    else localPreviewOpen = false;
  }

  function currentScrollIdx() {
    const c = $('scrollContainer');
    const viewCenter = c.scrollTop + c.clientHeight / 2;
    const kids = c.children;
    let best = 0, bestDist = Infinity;
    for (let i = 0; i < kids.length; i++) {
      const el = kids[i];
      const top = el.offsetTop;
      const bottom = top + el.offsetHeight;
      if (viewCenter >= top && viewCenter <= bottom) return i;
      const mid = (top + bottom) / 2;
      const d = Math.abs(mid - viewCenter);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    return best;
  }
  let scrollSettleTimer = null;
  let lastUserScroll = 0;
  $('scrollContainer').addEventListener('scroll', () => {
    if (scrollSuppressSync) return;
    lastUserScroll = Date.now();
    clearTimeout(scrollSettleTimer);
    scrollSettleTimer = setTimeout(() => {
      const idx = currentScrollIdx();
      const items = (state && state.images) || [];
      if (!items[idx]) return;
      $('scrollIdx').textContent = `[${idx + 1}/${items.length}] ${items[idx].name}`;
      if (sync) send('goto-preview', { index: idx });
      else localPreviewIdx = idx;
    }, 250);
  }, { passive: true });

  $('btnScrollClose').onclick = closeScrollPreview;
  $('btnScrollFs').onclick = toggleFs;
  $('scrollContainer').addEventListener('click', (e) => {
    if (e.target.tagName === 'IMG') toggleScrollChrome();
  });

  // Two taps on blank chrome → toggle fullscreen. dblclick alone isn't enough:
  // touch browsers don't fire it reliably, hence the paired tap timer.
  function isBlankTarget(el) {
    if (!el) return false;
    if (el.id === 'main' || el.id === 'grid' || el.id === 'app') return true;
    if (el.classList && el.classList.contains('empty')) return true;
    return false;
  }
  // .title is flex:1, so the dead space between the folder name and ☰ is #title
  // itself rather than <header> — match on the ancestor, not a fixed id.
  function isHeaderBlank(el) {
    if (!el || !el.closest) return false;
    if (el.closest('button')) return false;  // ← and ☰ keep their own actions
    return !!el.closest('header');
  }
  function bindDoubleTapFs(el, isBlank) {
    el.addEventListener('dblclick', (e) => { if (isBlank(e.target)) toggleFs(); });
    let lastTap = 0, multi = false;
    el.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) { multi = true; lastTap = 0; }
    }, { passive: true });
    el.addEventListener('touchend', (e) => {
      // ignore multi-finger gestures (pinch); only single-tap counts
      if (multi || e.touches.length > 0 || e.changedTouches.length > 1) {
        if (e.touches.length === 0) multi = false;
        lastTap = 0;
        return;
      }
      if (!isBlank(e.target)) { lastTap = 0; return; }
      const now = Date.now();
      if (now - lastTap < 320) { toggleFs(); lastTap = 0; e.preventDefault(); }
      else lastTap = now;
    });
  }
  bindDoubleTapFs($('main'), isBlankTarget);
  bindDoubleTapFs(document.querySelector('header'), isHeaderBlank);
})();
</script>
</body>
</html>
